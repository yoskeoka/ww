name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"
      - run: make lint
      - run: make test-all
      - run: make build

  performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"
      - name: Evaluate advisory performance budget
        run: |
          started=$(date +%s)
          set +e
          make perf-check
          status=$?
          elapsed=$(( $(date +%s) - started ))
          {
            echo "## Performance budget"
            echo
            echo "Duration: ${elapsed}s"
            if [ "$status" -eq 0 ]; then
              echo "Result: passed"
            else
              echo "Result: exceeded or evaluator failure (advisory; investigate before merge)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
